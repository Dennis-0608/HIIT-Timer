<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Timer Plus</title>
    <!-- Web App iOS PWA 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Timer Plus">
    <link rel="apple-touch-icon" href="https://api.iconify.design/heroicons:clock-solid.svg?color=%23dc2626&height=180">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 隱藏 Safari 下拉刷新與溢出滾動，營造原生 App 體感 */
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827;
            transition: background-color 0.4s ease-in-out;
            height: 100dvh;
            overflow: hidden;
        }

        /* 各狀態的動態背景顏色 */
        body.state-idle { background-color: #111827; }
        body.state-prepare { background-color: #d97706; }
        body.state-work { background-color: #dc2626; }
        body.state-rest { background-color: #2563eb; }
        body.state-finished { background-color: #16a34a; }

        /* 脈動動畫 (最後 3 秒提示) */
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 0.5s ease-in-out infinite;
        }

        /* 數字極致放大樣式 (使用 clamp 與 Dynamic Viewport 單位) */
        .big-timer-text {
            font-size: clamp(80px, 22vw, 220px);
            line-height: 1;
        }

        /* 📱 橫放 (Landscape) 佈局最佳化 */
        @media (orientation: landscape) {
            .app-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto 1fr;
                gap: 10px;
                height: 100%;
            }
            .grid-header {
                grid-column: 1 / -1;
            }
            .grid-main {
                grid-column: 1;
                grid-row: 2;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .grid-controls {
                grid-column: 2;
                grid-row: 2;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 12px;
                overflow-y: auto;
            }
            .big-timer-text {
                font-size: clamp(60px, 28vh, 160px);
            }
        }
    </style>
</head>
<body class="state-idle text-white select-none overflow-hidden">

    <div class="app-grid h-full flex flex-col justify-between p-4 sm:p-6 pb-8 env-safe-padding">
        <!-- 頂部資訊欄 -->
        <header class="grid-header pt-2 sm:pt-4 text-center">
            <div id="statusLabel" class="text-2xl sm:text-3xl font-black tracking-widest uppercase transition-all duration-300 drop-shadow-md">
                TIMER PLUS
            </div>
            <div id="roundLabel" class="text-base sm:text-lg font-medium text-white/80 mt-1 opacity-0 transition-opacity duration-300">
                ROUND 1 / 5
            </div>
        </header>

        <!-- 中央超大數字顯示器 -->
        <main class="grid-main flex-1 flex flex-col items-center justify-center my-2">
            <div id="timeDisplay" class="big-timer-text font-extrabold tracking-tight font-mono drop-shadow-lg transition-transform">
                00:00
            </div>
        </main>

        <!-- 底部控制區 / 橫屏右側區 -->
        <div class="grid-controls w-full max-w-md mx-auto">
            <!-- 設定面板 (僅在 Idle 狀態顯示) -->
            <section id="setupPanel" class="w-full bg-black/30 backdrop-blur-md rounded-3xl p-4 sm:p-5 border border-white/10 shadow-2xl space-y-3 transition-all">
                <!-- Prepare 設定 (分 + 秒) -->
                <div class="flex items-center justify-between">
                    <span class="text-sm sm:text-base font-semibold flex items-center gap-1.5">
                        <i class="fa-solid fa-hourglass-start text-amber-400"></i> 準備
                    </span>
                    <div class="flex items-center gap-1 sm:gap-2">
                        <!-- 分 -->
                        <button onclick="adjustSetting('prepMin', -1)" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/10 active:bg-white/30 text-base font-bold flex items-center justify-center">-</button>
                        <span id="valPrepMin" class="w-8 text-center text-base sm:text-lg font-bold font-mono">0m</span>
                        <button onclick="adjustSetting('prepMin', 1)" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/10 active:bg-white/30 text-base font-bold flex items-center justify-center">+</button>
                        <!-- 秒 -->
                        <button onclick="adjustSetting('prepSec', -5)" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/10 active:bg-white/30 text-base font-bold flex items-center justify-center ml-1">-</button>
                        <span id="valPrepSec" class="w-9 text-center text-base sm:text-lg font-bold font-mono">5s</span>
                        <button onclick="adjustSetting('prepSec', 5)" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white/10 active:bg-white/30 text-base font-bold flex items-center justify-center">+</button>
                    </div>
                </div>

                <!-- Work 設定 (分 + 秒) -->
                <div class="flex items-center justify-between">
                    <span
