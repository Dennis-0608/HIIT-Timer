<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Timer Plus</title>
    <!-- Web App iOS PWA 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Timer Plus">
    <link rel="apple-touch-icon" href="https://api.iconify.design/heroicons:clock-solid.svg?color=%23dc2626&height=180">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 隱藏 Safari 下拉刷新與溢出滾動，營造原生 App 體感 */
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827;
            transition: background-color 0.4s ease-in-out;
        }

        /* 各狀態的動態背景顏色 */
        body.state-idle { background-color: #111827; }
        body.state-prepare { background-color: #d97706; }
        body.state-work { background-color: #dc2626; }
        body.state-rest { background-color: #2563eb; }
        body.state-finished { background-color: #16a34a; }

        /* 脈動動畫 (最後 3 秒提示) */
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="state-idle text-white min-h-screen flex flex-col justify-between p-6 pb-12 select-none overflow-hidden">

    <!-- 頂部資訊欄 -->
    <header class="pt-6 text-center">
        <div id="statusLabel" class="text-3xl font-black tracking-widest uppercase transition-all duration-300 drop-shadow-md">
            TIMER PLUS
        </div>
        <div id="roundLabel" class="text-lg font-medium text-white/80 mt-1 opacity-0 transition-opacity duration-300">
            ROUND 1 / 5
        </div>
    </header>

    <!-- 中央超大數字顯示器 -->
    <main class="flex-1 flex flex-col items-center justify-center my-4">
        <div id="timeDisplay" class="text-8xl sm:text-9xl font-extrabold tracking-tight font-mono drop-shadow-lg transition-transform">
            00:00
        </div>
    </main>

    <!-- 設定面板 (僅在 Idle 狀態顯示) -->
    <section id="setupPanel" class="w-full max-w-md mx-auto bg-black/30 backdrop-blur-md rounded-3xl p-5 border border-white/10 shadow-2xl space-y-3 transition-all">
        <!-- Prepare 設定 -->
        <div class="flex items-center justify-between">
            <span class="text-base font-semibold flex items-center gap-2">
                <i class="fa-solid fa-hourglass-start text-amber-400"></i> 準備 Prepare
            </span>
            <div class="flex items-center gap-3">
                <button onclick="adjustSetting('prepare', -1)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">-</button>
                <span id="valPrepare" class="w-12 text-center text-xl font-bold font-mono">5s</span>
                <button onclick="adjustSetting('prepare', 1)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">+</button>
            </div>
        </div>

        <!-- Work 設定 -->
        <div class="flex items-center justify-between">
            <span class="text-base font-semibold flex items-center gap-2">
                <i class="fa-solid fa-fire text-red-500"></i> 運動 Work
            </span>
            <div class="flex items-center gap-3">
                <button onclick="adjustSetting('work', -5)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">-</button>
                <span id="valWork" class="w-12 text-center text-xl font-bold font-mono">20s</span>
                <button onclick="adjustSetting('work', 5)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">+</button>
            </div>
        </div>

        <!-- Rest 設定 -->
        <div class="flex items-center justify-between">
            <span class="text-base font-semibold flex items-center gap-2">
                <i class="fa-solid fa-bed text-blue-400"></i> 休息 Rest
            </span>
            <div class="flex items-center gap-3">
                <button onclick="adjustSetting('rest', -5)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">-</button>
                <span id="valRest" class="w-12 text-center text-xl font-bold font-mono">10s</span>
                <button onclick="adjustSetting('rest', 5)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">+</button>
            </div>
        </div>

        <!-- Rounds 設定 -->
        <div class="flex items-center justify-between">
            <span class="text-base font-semibold flex items-center gap-2">
                <i class="fa-solid fa-rotate text-emerald-400"></i> 組數 Rounds
            </span>
            <div class="flex items-center gap-3">
                <button onclick="adjustSetting('rounds', -1)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">-</button>
                <span id="valRounds" class="w-12 text-center text-xl font-bold font-mono">5</span>
                <button onclick="adjustSetting('rounds', 1)" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 text-xl font-bold flex items-center justify-center">+</button>
            </div>
        </div>
    </section>

    <!-- 底部控制按鈕區 -->
    <footer class="w-full max-w-md mx-auto mt-6 flex items-center justify-center gap-6">
        <!-- 重置按鈕 -->
        <button id="btnReset" onclick="resetTimer()" class="hidden w-16 h-16 rounded-full bg-white/20 active:bg-white/40 text-white flex items-center justify-center text-2xl shadow-lg backdrop-blur-md transition-transform active:scale-95">
            <i class="fa-solid fa-rotate-left"></i>
        </button>

        <!-- 主操作按鈕 (Play / Pause / Resume) -->
        <button id="btnMain" onclick="togglePlayPause()" class="w-24 h-24 rounded-full bg-white text-gray-900 active:bg-gray-200 flex items-center justify-center text-4xl font-bold shadow-2xl transition-transform active:scale-95">
            <i id="mainIcon" class="fa-solid fa-play ml-1"></i>
        </button>
    </footer>

    <!-- JavaScript 邏輯處理 -->
    <script>
        // 1. 核心參數與狀態設定
        const config = {
            prepare: 5,
            work: 20,
            rest: 10,
            rounds: 5
        };

        const STATES = {
            IDLE: 'idle',
            PREPARE: 'prepare',
            WORK: 'work',
            REST: 'rest',
            FINISHED: 'finished'
        };

        let currentState = STATES.IDLE;
        let currentRound = 1;
        let timeRemaining = 0;
        let timerInterval = null;
        let isPaused = false;

        // Web Audio API 提示音合成器 (不需任何外部 mp3 檔案)
        let audioCtx = null;

        function playSound(freq, duration, type = 'sine') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log('Audio Playback error:', e);
            }
        }

        // 防鎖屏 Wake Lock API
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock Error:', err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // 2. UI 畫面渲染更新
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateUI() {
            const timeDisplay = document.getElementById('timeDisplay');
            const statusLabel = document.getElementById('statusLabel');
            const roundLabel = document.getElementById('roundLabel');
            const setupPanel = document.getElementById('setupPanel');
            const btnReset = document.getElementById('btnReset');
            const mainIcon = document.getElementById('mainIcon');

            // 背景色切換
            document.body.className = `state-${currentState} text-white min-h-screen flex flex-col justify-between p-6 pb-12 select-none overflow-hidden`;

            // 狀態與數字顯示
            if (currentState === STATES.IDLE) {
                statusLabel.innerText = 'TIMER PLUS';
                roundLabel.classList.add('opacity-0');
                timeDisplay.innerText = formatTime(config.work);
                setupPanel.classList.remove('hidden');
                btnReset.classList.add('hidden');
                mainIcon.className = 'fa-solid fa-play ml-1';
            } else {
                setupPanel.classList.add('hidden');
                btnReset.classList.remove('hidden');
                roundLabel.classList.remove('opacity-0');
                roundLabel.innerText = `ROUND ${currentRound} / ${config.rounds}`;

                if (currentState === STATES.PREPARE) {
                    statusLabel.innerText = 'GET READY';
                } else if (currentState === STATES.WORK) {
                    statusLabel.innerText = 'WORK!';
                } else if (currentState === STATES.REST) {
                    statusLabel.innerText = 'REST';
                } else if (currentState === STATES.FINISHED) {
                    statusLabel.innerText = 'WELL DONE!';
                    roundLabel.innerText = 'COMPLETED';
                }

                timeDisplay.innerText = formatTime(timeRemaining);

                if (isPaused) {
                    mainIcon.className = 'fa-solid fa-play ml-1';
                } else {
                    mainIcon.className = 'fa-solid fa-pause';
                }
            }

            // 最後 3 秒脈動視覺提示
            if (timeRemaining <= 3 && timeRemaining > 0 && !isPaused && currentState !== STATES.IDLE) {
                timeDisplay.classList.add('animate-pulse-fast');
            } else {
                timeDisplay.classList.remove('animate-pulse-fast');
            }
        }

        // 3. 設定參數調整
        function adjustSetting(type, delta) {
            if (currentState !== STATES.IDLE) return;
            
            if (type === 'prepare') {
                config.prepare = Math.max(0, config.prepare + delta);
                document.getElementById('valPrepare').innerText = `${config.prepare}s`;
            } else if (type === 'work') {
                config.work = Math.max(5, config.work + delta);
                document.getElementById('valWork').innerText = `${config.work}s`;
            } else if (type === 'rest') {
                config.rest = Math.max(0, config.rest + delta);
                document.getElementById('valRest').innerText = `${config.rest}s`;
            } else if (type === 'rounds') {
                config.rounds = Math.max(1, config.rounds + delta);
                document.getElementById('valRounds').innerText = config.rounds;
            }
            updateUI();
        }

        // 4. 狀態機與倒數核心邏輯
        function switchState(nextState) {
            currentState = nextState;

            if (currentState === STATES.PREPARE) {
                timeRemaining = config.prepare;
                playSound(600, 0.3);
            } else if (currentState === STATES.WORK) {
                timeRemaining = config.work;
                playSound(800, 0.5);
            } else if (currentState === STATES.REST) {
                timeRemaining = config.rest;
                playSound(400, 0.5);
            } else if (currentState === STATES.FINISHED) {
                timeRemaining = 0;
                clearInterval(timerInterval);
                playSound(1000, 0.8, 'square');
                releaseWakeLock();
            }

            // 若設定 Prepare 或 Rest 時間為 0，自動進入下一階段
            if (timeRemaining === 0 && currentState !== STATES.FINISHED) {
                advancePhase();
                return;
            }

            updateUI();
        }

        function advancePhase() {
            if (currentState === STATES.PREPARE) {
                switchState(STATES.WORK);
            } else if (currentState === STATES.WORK) {
                if (currentRound < config.rounds) {
                    if (config.rest > 0) {
                        switchState(STATES.REST);
                    } else {
                        currentRound++;
                        switchState(STATES.WORK);
                    }
                } else {
                    switchState(STATES.FINISHED);
                }
            } else if (currentState === STATES.REST) {
                currentRound++;
                switchState(STATES.WORK);
            }
        }

        function tick() {
            if (isPaused) return;

            if (timeRemaining > 1) {
                timeRemaining--;
                // 最後 3 秒播放 Short Beep 提醒
                if (timeRemaining <= 3) {
                    playSound(700, 0.15);
                }
            } else {
                advancePhase();
            }
            updateUI();
        }

        // 5. 按鈕控制邏輯
        function togglePlayPause() {
            // 初始化聲音情境 (iOS 限制需使用者互動)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (currentState === STATES.IDLE || currentState === STATES.FINISHED) {
                currentRound = 1;
                isPaused = false;
                requestWakeLock();
                
                if (config.prepare > 0) {
                    switchState(STATES.PREPARE);
                } else {
                    switchState(STATES.WORK);
                }

                clearInterval(timerInterval);
                timerInterval = setInterval(tick, 1000);
            } else {
                // 暫停 / 繼續 切換
                isPaused = !isPaused;
                if (isPaused) {
                    releaseWakeLock();
                } else {
                    requestWakeLock();
                }
            }
            updateUI();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            currentState = STATES.IDLE;
            currentRound = 1;
            isPaused = false;
            timeRemaining = 0;
            releaseWakeLock();
            updateUI();
        }

        // 初始化頁面
        updateUI();
    </script>
</body>
</html>
